<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">    
   <head>
       <div th:replace="~{fragment :: meta}"></div>   
            
       <div th:replace="~{fragment :: styles}"></div>
         
         <!-- Flatpickr -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
         
       <title>民宿詳細</title>   
   </head>
   <body>
       <div class="samuraitravel-wrapper">
           <!-- ヘッダー -->
           <div th:replace="~{fragment :: header}"></div>
           
           <main>
               <div class="container pt-4 pb-5 samuraitravel-container">
                   <div class="row justify-content-center">
                       <div class="col-xxl-9 col-xl-10 col-lg-11">
                           <nav class="mb-4" style="--bs-breadcrumb-divider: '>';" aria-label="breadcrumb">
                               <ol class="breadcrumb mb-0">                        
                                   <li class="breadcrumb-item"><a th:href="@{/}">ホーム</a></li>
                                   <li class="breadcrumb-item"><a th:href="@{/restaurants}">店舗一覧</a></li>
                                   <li class="breadcrumb-item active" aria-current="page">店舗詳細</li>
                               </ol>
                           </nav> 
                           
                           <!-- お気に入り機能 ここから -->
                                 <div sec:authorize="hasRole('ROLE_PREMIUM')">
                                     <div th:if="${favoriteFlag}">
<!--                                         <a href="#" onclick="event.preventDefault(); document.getElementById('favorite-form').submit();">&#9829; お気に入り解除</a>-->
<!--                                         <form method="post" th:action="@{/restaurants/__${restaurant.getId()}__/favorites/__${favorite.getId()}__/delete}"></form>-->
									  <form method="post" th:action="@{/restaurants/{restaurantId}/favorites/{favoriteId}/delete(restaurantId=${restaurant.id}, favoriteId=${favorite.id})}">
						              <button type="submit">&#9829; お気に入り解除</button>
        							  </form>
                                      </div>
                                      <div th:unless="${favoriteFlag}">
<!--                                         <a href="#" onclick="event.preventDefault(); document.getElementById('favorite-form').submit();">&#9825; お気に入り追加</a>-->
<!--                                         <form method="post" th:action="@{/restaurants/__${restaurant.getId()}__/favorites/create}"></form>     -->
									  <form method="post" th:action="@{/restaurants/{restaurantId}/favorites/create(restaurantId=${restaurant.id})}">
            						  <button type="submit">&#9825; お気に入り追加</button>
        							  </form>
                                     </div>
                                 </div>                            
<!--                             </div>-->
                             <!-- お気に入り機能 ここまで -->
                                                      
                           <h1 class="mb-4 text-center" th:text="${restaurant.getName()}"></h1>                                                           
                           
                           <div th:if="${errorMessage}" class="alert alert-danger">
                               <span th:text="${errorMessage}"></span>
                           </div>                                                                         
                           
                           <div class="mb-4">
                               <img th:if="${restaurant.getImage()}" th:src="@{/storage/__${restaurant.getImage()}__}" class="w-100" alt="店舗画像">
                               <img th:unless="${restaurant.getImage()}" th:src="@{/images/noImage.png}" class="w-100" alt="NO IMAGE">
                           </div> 
                           
                           <div class="container">  
                               <div class="row">
                                   <div class="col-lg-8 container mb-4">            
                                       <div class="row pb-2 mb-2 border-bottom">
                                           <div class="col-4">
                                               <span class="fw-bold">店舗名</span>
                                           </div>
                   
                                           <div class="col">
                                               <span th:text="${restaurant.getName()}"></span>
                                           </div>
                                       </div>                    
                   
                                       <div class="row pb-2 mb-2 border-bottom">
                                           <div class="col-4">
                                               <span class="fw-bold">説明</span>
                                           </div>
                   
                                           <div class="col">
                                               <span class="samuraitravel-pre-wrap" th:text="${restaurant.getDescription()}"></span>
                                           </div>
                                       </div>
                   
                                       <div class="row pb-2 mb-2 border-bottom">
                                           <div class="col-4">
                                               <span class="fw-bold">最低料金</span>
                                           </div>
                   
                                           <div class="col">
                                               <span th:text="${#numbers.formatInteger(restaurant.getLowestPrice(), 1, 'COMMA') + '円～'}"></span>
                                           </div>
                                       </div> 
                                       
                                      <div class="row pb-2 mb-2 border-bottom">
                                           <div class="col-4">
                                               <span class="fw-bold">定員</span>
                                           </div>
                   
                                           <div class="col">
                                               <span th:text="${restaurant.getSeating_capacity() + '人'}"></span>
                                           </div>
                                       </div>                                
                                       
                                       <div class="row pb-2 mb-2 border-bottom">
                                           <div class="col-4">
                                               <span class="fw-bold">郵便番号</span>
                                           </div>
                   
                                           <div class="col">
                                               <span th:text="${restaurant.getPostalCode()}"></span>
                                           </div>
                                       </div>   
                                       
                                       <div class="row pb-2 mb-2 border-bottom">
                                           <div class="col-4">
                                               <span class="fw-bold">住所</span>
                                           </div>
                   
                                           <div class="col">
                                               <span th:text="${restaurant.getAddress()}"></span>
                                           </div>
                                       </div>   
                                       
<!--                                       <div class="row pb-2 mb-2 border-bottom">-->
<!--                                           <div class="col-4">-->
<!--                                               <span class="fw-bold">電話番号</span>-->
<!--                                           </div>-->
                   
<!--                                           <div class="col">-->
<!--                                               <span th:text="${restaurant.getPhoneNumber()}"></span>-->
<!--                                           </div>-->
<!--                                       </div>                                -->
                                   </div>
                                   
                                   <div sec:authorize="isAnonymous()" class="col-lg-4 px-0 ps-lg-4 mb-4">                  
                                       <div class="card">
                                           <div class="card-body">                                                                                                                                                                                                                     
                                               <p class="card-text">予約するには<a th:href="@{/login}">ログイン</a>が必要です。</p>                                                                                                                                            
                                               <button type="submit" class="btn text-white shadow-sm w-100 samuraitravel-btn" disabled>予約する</button>                                                                                                                
                                           </div>
                                       </div>  
                                   </div>   
                                   
                                   <div sec:authorize="isAuthenticated()" class="col-lg-4 px-0 ps-lg-4 mb-4">                  
                                        <div class="card">
                                            <div class="card-body"> 
<!--                                                <form method="get" th:action="@{/restaurants/__${restaurant.getId()}__/reservations/input}" th:object="${reservationInputForm}">                                                                                                                                                                       -->
                                                    <form method="post" th:action="@{/restaurants/{id}/reservations/create(id=${restaurant.id})}" th:object="${reservationInputForm}">
                                                    <div class="form-group mb-2">                                            
<!--                                                        <label for="reservationDatetime" class="col-form-label text-md-left fw-bold">予約日</label>-->
                                                            
<!--                                                        <div th:if="${#fields.hasErrors('reservedDatetime')}" class="text-danger small mb-2" th:errors="*{reservedDatetime}"></div>                                          -->
<!--                                                        <input type="text" class="form-control" th:field="*{reservedDatetime}">     -->
                                                        <div class="form-group mb-2">
															<label for="reservedDatetime" class="col-form-label text-md-left fw-bold">予約日時</label>
															<div th:if="${#fields.hasErrors('reservedDatetime')}" class="text-danger small mb-2" th:errors="*{reservedDatetime}">
															</div>
															<input type="text" id="reservedDatetime" class="form-control" th:field="*{reservedDatetime}" placeholder="予約日時を選択してください" autocomplete="off">
														</div>
														
														<!-- 予約時刻 -->
<!--														<div class="form-group mb-2">-->
<!--															<label for="reservationTime" class="col-form-label text-md-left fw-bold">予約時刻</label>-->
<!--															<select class="form-select" th:field="*{closing_time}">-->
<!--										   <option value="">選択してください</option>-->
<!--																   <option th:each="time : ${timeOptions}" th:value="${time}" th:text="${time.substring(0, 5)}"></option>-->
<!--															</select>-->
															
<!--														</div>-->
															                         	                                                                                               
                                                    </div>
                                                    
                                                    <div class="form-group mb-4">                                            
                                                        <label for="numberOfPeople" class="col-form-label text-md-left fw-bold">予約人数</label>  
                                                        <div th:if="${#fields.hasErrors('numberOfPeople')}" class="text-danger small mb-2" th:errors="*{numberOfPeople}"></div>                                            
                                                        <input type="number" class="form-control" th:field="*{numberOfPeople}" min="1">                                                                     
                                                    </div>
                                                                                                        
                                                    <div class="form-group">
                                                        <button type="submit" class="btn text-white shadow-sm w-100 samuraitravel-btn">予約する</button>
                                                    </div>
                                                </form>                                                                     
                                            </div>
                                        </div>  
                                    </div> 
                                                                                                                                                     
                               </div>                                                                                             
                           </div>
                           
                           <!-- レビュー機能 ここから -->
                             <div class="container px-0">
                                 <h2 class="mb-4 text-center">レビュー</h2>
                                 <div class="row justify-content-center mb-4" sec:authorize="hasRole('ROLE_GENERAL') or hasRole('ROLE_PREMIUM')" th:unless="${reviewFlag}">
                                     <div class="col-lg-4">
                                         <a th:href="@{/restaurants/__${restaurant.getId()}__/reviews/register}">レビューを投稿する</a>
                                     </div>
                                 </div>
                                 <div class="mb-4" th:if="${#lists.isEmpty(reviewList)}">                                    
                                     <p class="text-center">まだレビューがありません。</p>                                    
                                 </div>                                                                 
                                 <div class="row row-cols-1 row-cols-md-2 g-4 mb-4" th:unless="${#lists.isEmpty(reviewList)}">
                                     <div class="col" th:each="review:${reviewList}">                                         
                                             <div class="card">
                                                 <div class="card-body">
                                                     <div class="d-flex justify-content-between">
                                                         <h5 class="card-title" th:text="${review.getUser().getName()}"></h5>                                                    
                                                         <span sec:authorize="hasRole('ROLE_GENERAL') or hasRole('ROLE_PREMIUM')" th:if="${#authentication.principal.user.id == review.getUser().getId()}">

                                                             <a class="me-2" th:href="@{/restaurants/{restaurantId}/reviews/{reviewId}/edit(restaurantId=${restaurant.id}, reviewId=${review.id})}">編集</a>
                                                             <a href="#" class="samuraitravel-link-danger" data-bs-toggle="modal" th:data-bs-target="${'#deleteReviewModal' + review.id}">削除</a>

                                                             <div class="modal fade" th:id="${'deleteReviewModal' + review.id}" tabindex="-1" th:aria-labelledby="${'deleteReviewModalLabel' + review.id}">
                                            			 	 <div class="modal-dialog">
                                                			 <div class="modal-content">
                                                    		 <div class="modal-header">
                                                        		<h5 class="modal-title" th:id="${'deleteReviewModalLabel' + review.id}" th:text="'このレビューを削除してもよろしいですか？'"></h5>
                                                        		<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="閉じる"></button>
                                                    			</div>
                                                    			<div class="modal-footer">
                                                        		 <form method="post"th:action="@{/restaurants/__${restaurant.getId()}__/reviews/__${review.id}__/delete}">
                                                           	  	 <button type="submit" class="btn samuraitravel-btn-danger text-white shadow-sm">削除</button>
                                                        		 </form>
                                                    			</div>
                                                			 </div>
                                            				 </div>
                                                             </div>
                                                         </span>      
                                                     </div>                                              
                                                     <p class="card-text mb-1">
                                                        <span th:if="${review.getScore() == 1 }">☆1</span>
                                                     	<span th:if="${review.getScore() == 2 }">☆2</span>
                                                     	<span th:if="${review.getScore() == 3 }">☆3</span>
                                                     	<span th:if="${review.getScore() == 4 }">☆4</span>
                                                     	<span th:if="${review.getScore() == 5 }">☆5</span>
                                                     </p>                      
                                                     <p class="card-text" th:text="${review.getContent()}"></p>
                                                 </div>
                                             </div>
                                         </div>
                                     </div>                                 
                                 <div class="text-center mb-4" th:if="${totalCount > 6}">
                                     <a th:href="@{/restaurants/__${restaurant.getId()}__/reviews}">すべてのレビューを見る</a>
                                 </div>                                                            
                             </div> 
                           
                       </div>
                   </div>
               </div>
           </main>
           
           <!-- フッター -->
           <div th:replace="~{fragment :: footer}"></div>
       </div>    
       
       <div th:replace="~{fragment :: scripts}"></div>  
       
       <!-- Flatpickr -->
        <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
        <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ja.js"></script>
        <script th:src="@{/js/flatpickr.js}"></script>  
 </body>
</html>
